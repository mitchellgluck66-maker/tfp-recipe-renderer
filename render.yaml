services:
  - type: web
    name: tfp-recipe-renderer
    runtime: docker
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: USDA_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: SHARED_SECRET
        sync: false
      - key: MODEL
        value: claude-sonnet-4-6
